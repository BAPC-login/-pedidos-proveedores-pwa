name: Nuvasto live browser E2E

# Se ejecuta manualmente después de un despliegue Cloudflare confirmado.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve expected production version
        id: expected
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('professional/package.json','utf8')).version")
          release=$(node -e "const s=require('fs').readFileSync('worker/src/combined.js','utf8');const m=s.match(/PLATFORM_RELEASE='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Confirm the matching Nuvasto production release and R2
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
          EXPECTED_RELEASE: ${{ steps.expected.outputs.release }}
        run: |
          health=$(curl --fail --silent --show-error --max-time 20 --dump-header /tmp/headers https://pedidos-pro-ai.botreservasmultilocal.workers.dev/platform/health)
          release=$(grep -Ei '^x-nuvasto-release:|^x-pedidos-pro-release:' /tmp/headers | head -1 | tr -d '\r' | awk '{print $2}')
          PLATFORM_HEALTH="$health" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_RELEASE="$EXPECTED_RELEASE" RELEASE="$release" node <<'NODE'
          const h=JSON.parse(process.env.PLATFORM_HEALTH||'{}');
          const ok=h.ok===true
            && h.service==='nuvasto'
            && h.version===process.env.EXPECTED_VERSION
            && process.env.RELEASE===process.env.EXPECTED_RELEASE
            && h.r2Configured===true
            && h.r2Ready===true
            && Number(h.invoiceFlowVersion||0)>=28
            && Number(h.keyboardNavigationVersion||0)>=28;
          if(!ok){console.error(JSON.stringify(h,null,2));process.exit(1)}
          NODE

      - name: Install Playwright browsers
        working-directory: professional
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run Chromium and WebKit flows
        working-directory: professional
        env:
          E2E_BASE_URL: https://pedidos-pro-ai.botreservasmultilocal.workers.dev/
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node tests/live-browser-v15.mjs
