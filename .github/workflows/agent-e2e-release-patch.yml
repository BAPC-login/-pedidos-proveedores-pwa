name: Agent dynamic E2E release patch
on:
  push:
    branches: [agent/e2e-release-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: agent/e2e-release-contract}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Apply E2E release contract
        run: python .github/agent-patches/e2e_release_contract.py
      - name: Verify candidate
        working-directory: professional
        run: npm run verify
      - name: Commit test harness
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add professional/tests/production-e2e-v44.mjs
          git commit -m 'Make production E2E follow canonical release'
          git push origin HEAD:agent/e2e-release-contract
