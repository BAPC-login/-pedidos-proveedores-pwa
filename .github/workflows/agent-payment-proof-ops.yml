name: Agent payment proof ops consolidation
on:
  push:
    branches: [agent/payment-proof-ops-consolidation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/payment-proof-ops-consolidation
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply canonical consolidation
        run: |
          python .github/agent-patches/payment_proof_ops_consolidation.py
          python .github/agent-patches/payment_proof_ops_fix.py
      - name: Verify candidate
        working-directory: professional
        run: npm run verify
      - name: Commit canonical files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add professional worker
          git commit -m 'Add Gemini-assisted payments and consolidate catalog flow'
          git push origin HEAD:agent/payment-proof-ops-consolidation
