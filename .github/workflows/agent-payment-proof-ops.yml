name: Agent payment proof ops workflow handoff
on:
  push:
    branches: [agent/payment-proof-ops-consolidation]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/payment-proof-ops-consolidation
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify candidate
        working-directory: professional
        run: npm run verify
      - name: Generate protected workflow copies
        run: python .github/agent-patches/generate_r77_workflows.py
      - name: Publish generated workflow copies
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/generated
          git commit -m 'Generate r77 workflow guards'
          git push origin HEAD:agent/payment-proof-ops-consolidation
