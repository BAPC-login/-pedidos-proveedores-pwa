name: Agent payment proof ops verification
on:
  push:
    branches: [agent/payment-proof-ops-consolidation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify candidate
        working-directory: professional
        run: npm run verify
