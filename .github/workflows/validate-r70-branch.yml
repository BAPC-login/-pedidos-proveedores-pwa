name: Validate Nuvasto r70 branch
on:
  push:
    branches: ['fix/master-durable-r70']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify r70 candidate
        working-directory: professional
        run: npm run verify
