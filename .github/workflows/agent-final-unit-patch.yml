name: Agent supplier final-unit patch
on:
  push:
    branches: [agent/final-unit-supplier-readers]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: agent/final-unit-supplier-readers}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify canonical code
        working-directory: professional
        run: npm run verify
      - name: Generate guarded workflow copies
        run: |
          python .github/agent-patches/generate_final_unit_workflows.py
          grep -Fq "CLIENT_RELEASE='2026.08.14.76'" .github/generated/verify.yml.txt
          grep -Fq 'supplierFinalUnitReadersV76:true' .github/generated/verify.yml.txt
          grep -Fq 'supplierInvoiceProfilesV76' .github/generated/deploy-cloudflare.yml.txt
      - name: Publish generated workflow copies
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/generated
          git commit -m 'Generate r76 workflow guards'
          git push origin HEAD:agent/final-unit-supplier-readers
