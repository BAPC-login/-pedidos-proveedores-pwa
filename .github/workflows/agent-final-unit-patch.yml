name: Agent supplier final-unit patch
on:
  push:
    branches: [agent/final-unit-supplier-readers]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: agent/final-unit-supplier-readers}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Apply canonical patch
        run: python .github/agent-patches/final_unit_supplier_readers.py
      - name: Verify candidate
        working-directory: professional
        run: npm run verify
      - name: Commit patched canonical files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker professional .github/workflows/verify.yml .github/workflows/deploy-cloudflare.yml
          git commit -m 'Use supplier Total x Unidad as final cost'
          git push origin HEAD:agent/final-unit-supplier-readers
