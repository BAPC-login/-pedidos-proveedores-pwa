name: Verify Nuvasto candidate
on:
  pull_request:
    branches: [main]
    paths: ['professional/**','worker/**','wrangler.jsonc','.github/workflows/**']
  push:
    branches: ['agent/**']
    paths: ['professional/**','worker/**','wrangler.jsonc','.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 'verify-nuvasto-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify syntax, regressions and release contracts
        working-directory: professional
        run: npm run verify
