name: Nuvasto D1 backup
on:
  schedule:
    - cron: '21 5 * * *'
  workflow_dispatch:
    inputs:
      database_name:
        description: 'Nombre de la base D1. Vacío usa la variable NUVASTO_D1_DATABASE.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nuvasto-d1-backup
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NUVASTO_D1_DATABASE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f1adc1e73490ce30fe3c1588d2ca57fb
      CONFIGURED_DATABASE: ${{ vars.NUVASTO_D1_DATABASE }}
      MANUAL_DATABASE: ${{ inputs.database_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Resolve database and credentials
        id: database
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo '::error::Falta CLOUDFLARE_API_TOKEN'; exit 1; fi
          database="${MANUAL_DATABASE:-}"
          if [ -z "$database" ]; then database="${CONFIGURED_DATABASE:-}"; fi
          if [ -z "$database" ]; then
            echo '::error::Configura la variable de repositorio NUVASTO_D1_DATABASE o ejecuta manualmente indicando database_name.'
            exit 1
          fi
          echo "name=$database" >> "$GITHUB_OUTPUT"
      - name: Export remote D1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp=$(date -u +'%Y%m%dT%H%M%SZ')
          file="backup/nuvasto-d1-${stamp}.sql"
          npx --yes wrangler@4.114.0 d1 export '${{ steps.database.outputs.name }}' --remote --output="$file" --skip-confirmation --config professional/wrangler.toml
          test -s "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      - name: Validate restore into disposable SQLite database
        shell: bash
        run: |
          set -euo pipefail
          sqlite3 /tmp/nuvasto-restore-check.sqlite < "$BACKUP_FILE"
          tables=$(sqlite3 /tmp/nuvasto-restore-check.sqlite "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';")
          if [ "${tables:-0}" -lt 1 ]; then echo '::error::El export no produjo un esquema restaurable'; exit 1; fi
          echo "Restore validation OK · $tables tables"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvasto-d1-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
