name: Nuvasto D1 backup
on:
  schedule:
    - cron: '21 5 * * *'
  workflow_run:
    workflows: ['Deploy Nuvasto to Cloudflare']
    types: [completed]
  workflow_dispatch:
    inputs:
      database_name:
        description: 'Nombre de la base D1. Vacío usa la variable NUVASTO_D1_DATABASE.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nuvasto-d1-backup
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f1adc1e73490ce30fe3c1588d2ca57fb
      CONFIGURED_DATABASE: ${{ vars.NUVASTO_D1_DATABASE }}
      MANUAL_DATABASE: ${{ inputs.database_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Resolve database and credentials
        id: database
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo '::error::Falta CLOUDFLARE_API_TOKEN'; exit 1; fi
          database="${MANUAL_DATABASE:-}"
          if [ -z "$database" ]; then database="${CONFIGURED_DATABASE:-}"; fi
          if [ -z "$database" ]; then
            list_file=$(mktemp)
            npx --yes wrangler@4.114.0 d1 list --json --config professional/wrangler.toml > "$list_file"
            mapfile -t candidates < <(D1_LIST_FILE="$list_file" node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.env.D1_LIST_FILE,'utf8'));const rows=Array.isArray(value)?value:(value.result||value.databases||[]);for(const row of rows){if(row&&row.name)console.log(row.name)}")
            matches=()
            for candidate in "${candidates[@]}"; do
              probe_file=$(mktemp)
              if npx --yes wrangler@4.114.0 d1 execute "$candidate" --remote --json --config professional/wrangler.toml --command "SELECT COUNT(*) AS matched FROM sqlite_master WHERE type='table' AND name IN ('organizations','suppliers','products','orders','receptions','invoices','payment_documents','audit_logs');" > "$probe_file" 2>/dev/null; then
                if PROBE_FILE="$probe_file" node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.env.PROBE_FILE,'utf8'));let found=false;const walk=node=>{if(found||node==null)return;if(Array.isArray(node))return node.forEach(walk);if(typeof node==='object'){if(Number(node.matched)===8)found=true;Object.values(node).forEach(walk)}};walk(value);process.exit(found?0:1)"; then
                  matches+=("$candidate")
                fi
              fi
            done
            if [ "${#matches[@]}" -gt 1 ]; then
              production_matches=()
              for match in "${matches[@]}"; do
                normalized="${match,,}"
                if [[ ! "$normalized" =~ (^|[-_])(dev|development|staging|test|qa)([-_]|$) ]]; then
                  production_matches+=("$match")
                fi
              done
              if [ "${#production_matches[@]}" -eq 1 ]; then
                matches=("${production_matches[0]}")
              fi
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'Coincidencia D1: %s\n' "${matches[@]:-ninguna}"
              echo "::error::No se pudo resolver una única D1 productiva por firma de esquema y nombre de entorno (coincidencias: ${#matches[@]}). Configura NUVASTO_D1_DATABASE explícitamente."
              exit 1
            fi
            database="${matches[0]}"
            echo "D1 Nuvasto resuelta automáticamente por firma de esquema y entorno: $database"
          fi
          echo "name=$database" >> "$GITHUB_OUTPUT"
      - name: Export remote D1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp=$(date -u +'%Y%m%dT%H%M%SZ')
          file="backup/nuvasto-d1-${stamp}.sql"
          npx --yes wrangler@4.114.0 d1 export '${{ steps.database.outputs.name }}' --remote --output="$file" --skip-confirmation --config professional/wrangler.toml
          test -s "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      - name: Validate restore into disposable SQLite database
        shell: bash
        run: |
          set -euo pipefail
          sqlite3 /tmp/nuvasto-restore-check.sqlite < "$BACKUP_FILE"
          tables=$(sqlite3 /tmp/nuvasto-restore-check.sqlite "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';")
          if [ "${tables:-0}" -lt 1 ]; then echo '::error::El export no produjo un esquema restaurable'; exit 1; fi
          echo "Restore validation OK · $tables tables"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvasto-d1-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
