name: Deploy Nuvasto to Cloudflare

# Activación manual mientras se incorpora CLOUDFLARE_API_TOKEN en GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-nuvasto-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Confirm Cloudflare deployment credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en GitHub Actions."
            echo "Agrégalo en Settings > Secrets and variables > Actions y vuelve a ejecutar este workflow."
            exit 1
          fi

      - name: Deploy Worker, assets, D1 and R2 bindings
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f1adc1e73490ce30fe3c1588d2ca57fb
          workingDirectory: professional
          wranglerVersion: '4'
          command: deploy --config wrangler.toml --keep-vars

      - name: Verify deployed release and R2 binding
        shell: bash
        run: |
          expected=$(node -e "const s=require('fs').readFileSync('worker/src/combined.js','utf8');const m=s.match(/PLATFORM_RELEASE='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")
          url='https://pedidos-pro-ai.botreservasmultilocal.workers.dev/platform/health'
          for attempt in $(seq 1 24); do
            body=$(curl --fail --silent --show-error --max-time 20 --dump-header /tmp/headers "$url" 2>/dev/null || true)
            release=$(grep -Ei '^x-nuvasto-release:|^x-pedidos-pro-release:' /tmp/headers 2>/dev/null | head -1 | tr -d '\r' | awk '{print $2}' || true)
            ready=$(PLATFORM_HEALTH="$body" node <<'NODE'
          try {
            const h=JSON.parse(process.env.PLATFORM_HEALTH||'{}');
            process.stdout.write(h.ok===true&&h.r2Configured===true&&h.r2Required===true&&h.r2Ready===true&&h.storageBackend==='r2'?'true':'false');
          } catch { process.stdout.write('false'); }
          NODE
            )
            if [ "$release" = "$expected" ] && [ "$ready" = "true" ]; then
              echo "Nuvasto $release desplegado con R2 operativo."
              exit 0
            fi
            echo "Esperando despliegue ${attempt}/24 · release=${release:-none} · r2=$ready"
            sleep 10
          done
          echo "::error::Cloudflare no activó el release esperado con el binding R2."
          exit 1
