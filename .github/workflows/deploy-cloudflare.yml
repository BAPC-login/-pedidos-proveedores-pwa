name: Deploy Nuvasto to Cloudflare
on:
  push:
    branches: [main]
    paths: ['professional/**','worker/**','wrangler.jsonc','.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:
permissions: {contents: read, deployments: write, statuses: write}
concurrency: {group: deploy-nuvasto-production, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Validate production candidate
        id: candidate
        working-directory: professional
        run: npm run verify
      - name: Confirm Cloudflare deployment credential
        id: credential
        shell: bash
        env: {CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; fi
      - name: Deploy Worker, assets, D1 and R2 bindings
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: f1adc1e73490ce30fe3c1588d2ca57fb
          workingDirectory: professional
          wranglerVersion: '4.114.0'
          command: deploy --config wrangler.toml --keep-vars
      - name: Verify deployed release, schema, migration, storage and frontend assets
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node -e "const s=require('fs').readFileSync('worker/src/combined.js','utf8');const m=s.match(/PLATFORM_RELEASE='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")
          base='https://pedidos-pro-ai.botreservasmultilocal.workers.dev'
          for attempt in $(seq 1 24); do
            body=$(curl --fail --silent --show-error --max-time 30 --dump-header /tmp/headers "$base/platform/health?release=$expected&attempt=$attempt" 2>/dev/null || true)
            release=$(grep -Ei '^x-nuvasto-release:|^x-pedidos-pro-release:' /tmp/headers 2>/dev/null | head -1 | tr -d '\r' | awk '{print $2}' || true)
            ready=$(PLATFORM_HEALTH="$body" node <<'NODE'
          try {
            const h=JSON.parse(process.env.PLATFORM_HEALTH||'{}');
            const storage=h.ok===true&&h.r2Configured===true&&h.r2Required===true&&h.r2Ready===true&&h.storageBackend==='r2';
            const runtime=h.nativePerformanceV45===true&&h.schemaOffCriticalPathV45===true&&h.requestCoalescingV45===true&&h.operationsBootstrapV45===true&&h.directR2StreamingV45===true&&h.redirectSafeNavigationV50===true;
            const migration=h.folioMigrationV67===true&&Number(h.folioMigrationDetails?.skipped||0)===0;
            const r70=h.domainRouterV70===true&&h.ordersSchemaV67===true&&h.scopedHistoricalFoliosV67===true&&h.cursorOrdersV67===true&&h.reconciliationRequiredForClosure===true&&h.legacyDateFoliosRetired===true&&h.readOnlyOrderQueriesV68===true&&h.durableMasterDraftV69===true&&h.draftSaveNoFolioLockV69===true&&h.crossDeviceMasterDraftV70===true&&h.masterDraftServerBackedV70===true&&h.bulkClearMasterQuantitiesV70===true&&migration;
            process.stdout.write(storage&&runtime&&r70?'true':'false');
          } catch { process.stdout.write('false'); }
          NODE
            )
            if [ "$release" = "$expected" ] && [ "$ready" = "true" ]; then break; fi
            if [ "$attempt" = "24" ]; then echo "::error::Cloudflare no activó el release/schema/migración esperado. release=${release:-none} runtime=$ready body=$body"; exit 1; fi
            echo "Esperando despliegue ${attempt}/24 · release=${release:-none} · runtime=$ready"; sleep 10
          done
          stamp=$(date +%s)
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/app.js?v=$stamp" > /tmp/app.js
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/app-bootstrap.js?v=$stamp" > /tmp/app-bootstrap.js
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/app-order-core.js?v=$stamp" > /tmp/app-order-core.js
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/app-orders.js?v=$stamp" > /tmp/app-orders.js
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/app-invoice-entry-v29.js?v=$stamp" > /tmp/app-invoice-entry.js
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/app-mobile-runtime.js?v=$stamp" > /tmp/app-mobile-runtime.js
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/sw.js?v=$stamp" > /tmp/sw.js
          grep -Fq "CLIENT_RELEASE='$expected'" /tmp/app.js || { echo '::error::app.js productivo no coincide con el release'; exit 1; }
          grep -Fq "from './app-order-core.js'" /tmp/app-bootstrap.js || { echo '::error::bootstrap no usa el propietario canónico de Lista Maestra'; exit 1; }
          if grep -Fq 'app-order-core-v15.js' /tmp/app-bootstrap.js; then echo '::error::bootstrap todavía activa una versión antigua de Lista Maestra'; exit 1; fi
          grep -Fq 'LOCAL_DRAFT_VERSION=70' /tmp/app-order-core.js || { echo '::error::protección local de borrador r70 no está en producción'; exit 1; }
          grep -Fq 'SERVER_AUTOSAVE_DELAY=1200' /tmp/app-order-core.js || { echo '::error::sincronización de Lista Maestra no tiene la cadencia r70'; exit 1; }
          grep -Fq 'id="clearMasterQuantities"' /tmp/app-order-core.js || { echo '::error::botón Eliminar todo no está en producción'; exit 1; }
          grep -Fq 'Guardado en sistema · disponible en otros dispositivos' /tmp/app-order-core.js || { echo '::error::guardado de sistema multi-dispositivo no está en producción'; exit 1; }
          grep -Fq 'serverSavePromise' /tmp/app-order-core.js || { echo '::error::autosaves de sistema no están serializados'; exit 1; }
          grep -Fq "'Idempotency-Key':payload.idempotencyKey" /tmp/app-order-core.js || { echo '::error::Guardar archivo no tiene idempotencia estable'; exit 1; }
          grep -Fq 'timeout:45000,persist:true' /tmp/app-order-core.js || { echo '::error::Guardar archivo no tiene timeout operacional'; exit 1; }
          grep -Fq 'TRAZABILIDAD CERRADA' /tmp/app-orders.js || { echo '::error::app-orders.js productivo no tiene separación Pedidos/Historial'; exit 1; }
          grep -Fq 'data-v67-order-actions' /tmp/app-orders.js || { echo '::error::menú nativo de pedidos no está en producción'; exit 1; }
          grep -Fq "view:history?'history':'active'" /tmp/app-orders.js || { echo '::error::consulta canónica active/history no está en producción'; exit 1; }
          if grep -Fq "app-orders-v30.js" /tmp/app-invoice-entry.js; then echo '::error::un renderer antiguo todavía compite por la ruta Orders'; exit 1; fi
          grep -Fq 'r70-canonical-mobile' /tmp/app-mobile-runtime.js || { echo '::error::runtime móvil r70 no está en producción'; exit 1; }
          grep -Fq 'keepQuantityVisible' /tmp/app-mobile-runtime.js || { echo '::error::scroll de flechas no está en producción'; exit 1; }
          grep -Fq 'nuvasto-v70-offline-data' /tmp/sw.js || { echo '::error::service worker r70 no está en producción'; exit 1; }
          grep -Fq "'./app-order-core.js'" /tmp/sw.js || { echo '::error::Lista Maestra canónica no está en precache'; exit 1; }
          if grep -Fq "'./app-order-core-v15.js'" /tmp/sw.js; then echo '::error::Service Worker todavía precarga Lista Maestra versionada'; exit 1; fi
          grep -Fq 'apiNetworkTimeout' /tmp/sw.js || { echo '::error::timeout API adaptable no está en producción'; exit 1; }
          grep -Fq 'releaseAssetResponse' /tmp/sw.js || { echo '::error::assets release no están en network-first'; exit 1; }
          echo "Nuvasto $release · backend, D1/R2, borrador multi-dispositivo, Eliminar todo y frontend r70 verificados."
      - name: Production procurement journey
        id: synthetic
        if: steps.verify.outcome == 'success'
        working-directory: professional
        env:
          NUVASTO_BASE_URL: https://pedidos-pro-ai.botreservasmultilocal.workers.dev
          NUVASTO_E2E_EMAIL: '${{ secrets.NUVASTO_E2E_EMAIL }}'
          NUVASTO_E2E_PASSWORD: '${{ secrets.NUVASTO_E2E_PASSWORD }}'
        run: node tests/production-e2e-v44.mjs
      - name: Report authenticated E2E coverage
        id: e2e_coverage
        if: always() && steps.verify.outcome == 'success'
        shell: bash
        env:
          E2E_EMAIL: '${{ secrets.NUVASTO_E2E_EMAIL }}'
          E2E_PASSWORD: '${{ secrets.NUVASTO_E2E_PASSWORD }}'
        run: |
          if [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ]; then echo 'authenticated=true' >> "$GITHUB_OUTPUT"; echo 'E2E autenticado configurado.'; else echo 'authenticated=false' >> "$GITHUB_OUTPUT"; echo '::warning::E2E autenticado no configurado; el smoke público r70 sí fue ejecutado.'; fi
      - name: Publish production status on commit
        if: always() && !cancelled()
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if [ "${{ steps.candidate.outcome }}" = "success" ] && [ "${{ steps.deploy.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ] && [ "${{ steps.synthetic.outcome }}" != "failure" ]; then
            state=success
            if [ "${{ steps.e2e_coverage.outputs.authenticated }}" = "true" ]; then description='Nuvasto r70 publicado; master multi-dispositivo y E2E autenticado OK'; else description='Nuvasto r70 publicado; master multi-dispositivo/frontend/backend OK'; fi
          else state=failure; description='El despliegue de Nuvasto r70 no quedó verificado'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='nuvasto/production' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
