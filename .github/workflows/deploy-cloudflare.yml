name: Deploy Nuvasto to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'professional/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.wrangler/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: deploy-nuvasto-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate production candidate
        id: candidate
        working-directory: professional
        run: npm run verify

      - name: Confirm Cloudflare deployment credential
        id: credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en GitHub Actions."
            exit 1
          fi

      - name: Deploy Worker, assets, D1 and R2 bindings
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f1adc1e73490ce30fe3c1588d2ca57fb
          workingDirectory: professional
          wranglerVersion: '4'
          command: deploy --config wrangler.toml --keep-vars

      - name: Verify deployed release, R2 and v42 capabilities
        id: verify
        shell: bash
        run: |
          expected=$(node -e "const s=require('fs').readFileSync('worker/src/combined.js','utf8');const m=s.match(/PLATFORM_RELEASE='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")
          url='https://pedidos-pro-ai.botreservasmultilocal.workers.dev/platform/health'
          for attempt in $(seq 1 24); do
            body=$(curl --fail --silent --show-error --max-time 20 --dump-header /tmp/headers "$url" 2>/dev/null || true)
            release=$(grep -Ei '^x-nuvasto-release:|^x-pedidos-pro-release:' /tmp/headers 2>/dev/null | head -1 | tr -d '\r' | awk '{print $2}' || true)
            ready=$(PLATFORM_HEALTH="$body" node <<'NODE'
          try {
            const h=JSON.parse(process.env.PLATFORM_HEALTH||'{}');
            const storage=h.ok===true&&h.r2Configured===true&&h.r2Required===true&&h.r2Ready===true&&h.storageBackend==='r2';
            const v42=h.reliableEmissionV42===true&&h.emissionPdfVerification===true&&h.masterProductOrdering===true;
            process.stdout.write(storage&&v42?'true':'false');
          } catch { process.stdout.write('false'); }
          NODE
            )
            if [ "$release" = "$expected" ] && [ "$ready" = "true" ]; then
              echo "Nuvasto $release desplegado con R2, emisión PDF verificada y orden maestro v42 operativos."
              exit 0
            fi
            echo "Esperando despliegue ${attempt}/24 · release=${release:-none} · v42+r2=$ready"
            sleep 10
          done
          echo "::error::Cloudflare no activó el release esperado con R2 y las capacidades v42."
          exit 1

      - name: Publish production status on commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.candidate.outcome }}" = "success" ] && [ "${{ steps.deploy.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ]; then
            state=success
            description='Nuvasto v42 publicado y verificado en Cloudflare'
          else
            state=failure
            description='El despliegue de Nuvasto a producción no quedó verificado'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='nuvasto/production' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
