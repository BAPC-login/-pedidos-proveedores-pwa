name: Deploy Nuvasto to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'professional/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.wrangler/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: deploy-nuvasto-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate production candidate
        id: candidate
        working-directory: professional
        run: npm run verify

      - name: Confirm Cloudflare deployment credential
        id: credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en GitHub Actions."
            exit 1
          fi

      - name: Deploy Worker, assets, D1 and R2 bindings
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f1adc1e73490ce30fe3c1588d2ca57fb
          workingDirectory: professional
          wranglerVersion: '4.114.0'
          command: deploy --config wrangler.toml --keep-vars

      - name: Verify deployed consolidated runtime
        id: verify
        shell: bash
        run: |
          expected=$(node --input-type=module -e "import('./professional/worker/src/index-current.js').then(m=>process.stdout.write(m.CURRENT_RELEASE))")
          url='https://pedidos-pro-ai.botreservasmultilocal.workers.dev/platform/health'
          for attempt in $(seq 1 24); do
            body=$(curl --fail --silent --show-error --max-time 20 --dump-header /tmp/headers "$url" 2>/dev/null || true)
            release=$(grep -Ei '^x-nuvasto-release:|^x-pedidos-pro-release:' /tmp/headers 2>/dev/null | head -1 | tr -d '\r' | awk '{print $2}' || true)
            runtime=$(grep -Ei '^x-nuvasto-runtime:' /tmp/headers 2>/dev/null | head -1 | tr -d '\r' | awk '{print $2}' || true)
            ready=$(PLATFORM_HEALTH="$body" node <<'NODE'
          try {
            const h=JSON.parse(process.env.PLATFORM_HEALTH||'{}');
            const storage=h.ok===true&&h.r2Configured===true&&h.r2Required===true&&h.r2Ready===true&&h.storageBackend==='r2';
            const purchasing=h.reliableEmissionV42===true&&h.emissionPdfVerification===true&&h.masterProductOrdering===true;
            const experience=h.operationsBootstrapV43===true&&h.productLifecycleV43===true&&h.processNavigationV43===true;
            const procurement=h.procurementOsV44===true&&h.canonicalMasterDataV44===true&&h.granularPermissionsV44===true&&h.observabilityV44===true;
            const performance=h.requestCoalescingV45===true&&h.operationsBootstrapV45===true&&h.cacheFirstPwaV49===true&&h.redirectSafeNavigationV50===true&&h.screenBootstrapR52===true&&h.performanceIndexesR52===true;
            process.stdout.write(storage&&purchasing&&experience&&procurement&&performance?'true':'false');
          } catch { process.stdout.write('false'); }
          NODE
            )
            if [ "$release" = "$expected" ] && [ "$runtime" = "consolidated-r60" ] && [ "$ready" = "true" ]; then
              echo "Nuvasto $release desplegado y verificado con runtime consolidado r60."
              exit 0
            fi
            echo "Esperando despliegue ${attempt}/24 · release=${release:-none} · runtime=${runtime:-none} · contratos=$ready"
            sleep 10
          done
          echo "::error::Cloudflare no activó el release esperado con runtime consolidado y contratos funcionales."
          exit 1

      - name: Synthetic procurement journey on dedicated E2E tenant
        id: synthetic
        if: steps.verify.outcome == 'success'
        working-directory: professional
        env:
          NUVASTO_BASE_URL: https://pedidos-pro-ai.botreservasmultilocal.workers.dev
          NUVASTO_E2E_EMAIL: ${{ secrets.NUVASTO_E2E_EMAIL }}
          NUVASTO_E2E_PASSWORD: ${{ secrets.NUVASTO_E2E_PASSWORD }}
        run: node tests/production-e2e-v44.mjs

      - name: Publish production status on commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.candidate.outcome }}" = "success" ] && [ "${{ steps.deploy.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ] && [ "${{ steps.synthetic.outcome }}" != "failure" ]; then
            state=success
            description='Nuvasto r60 consolidado publicado y verificado en Cloudflare'
          else
            state=failure
            description='El despliegue consolidado de Nuvasto no quedó verificado'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='nuvasto/production' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
