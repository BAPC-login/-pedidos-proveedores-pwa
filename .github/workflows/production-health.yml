name: Nuvasto production health
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuvasto-production-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify Phase 14 release, contract and sustained health
        working-directory: professional
        env:
          NUVASTO_BASE_URL: 'https://pedidos-pro-ai.botreservasmultilocal.workers.dev'
          NUVASTO_HEALTH_ATTEMPTS: '3'
          NUVASTO_HEALTH_BUDGET_MS: '5000'
        run: node scripts/verify-production-health.mjs
