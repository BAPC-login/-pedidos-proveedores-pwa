name: One-time safe branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-cleanup-once.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: nuvasto-one-time-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Audit and remove obsolete branches
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          git show-ref --verify --quiet refs/remotes/origin/main || { echo '::error::origin/main no existe'; exit 1; }
          git show-ref --verify --quiet refs/remotes/origin/develop || { echo '::error::origin/develop no existe'; exit 1; }

          merged_branches=(
            'agent/ai-reconciliation-extras-v88'
            'agent/auth-passkeys-finalization'
            'agent/canonical-reconcile-finance-motion'
            'agent/canonical-release-verification'
            'agent/catalog-finance-icon-v81'
            'agent/dashboard-reconcile-dark-v82'
            'agent/e2e-release-contract'
            'agent/final-unit-supplier-readers'
            'agent/invoice-arithmetic-context'
            'agent/mobile-auth-invoice-v83'
            'agent/native-fast-consolidation'
            'agent/navigation-sessions-master-v87'
            'agent/payment-documents-r74'
            'agent/payment-proof-ops-consolidation'
            'agent/professional-readiness-v84'
            'agent/r78-invoice-matrix-passkeys-payment-ledger'
            'agent/reception-close-ios26'
            'agent/reconciliation-engine-r75'
            'agent/self-service-readiness-v85'
            'agent/v81-release-cutover'
            'fix/v91-production-stability'
          )

          ancestor_branches=(
            'agent/deploy-hardening-v86'
            'noop-do-not-create'
            'tmp'
            'tmp2'
            'tmp3'
          )

          exists() { git show-ref --verify --quiet "refs/remotes/origin/$1"; }

          echo 'Auditando ramas cuyo trabajo entró mediante PR fusionada...'
          for branch in "${merged_branches[@]}"; do
            if ! exists "$branch"; then
              echo "ya ausente: $branch"
              continue
            fi
            count=$(gh pr list --repo "$repo" --state merged --head "$branch" --json number --jq 'length')
            if [ "$count" -lt 1 ]; then
              echo "::error::$branch no tiene una PR fusionada verificable; se aborta sin borrar ramas."
              exit 1
            fi
            echo "OK PR fusionada: $branch"
          done

          echo 'Auditando ramas que son ancestros estrictos de main...'
          for branch in "${ancestor_branches[@]}"; do
            if ! exists "$branch"; then
              echo "ya ausente: $branch"
              continue
            fi
            if ! git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "::error::$branch contiene commits fuera de main; se aborta sin borrar ramas."
              exit 1
            fi
            echo "OK ancestro de main: $branch"
          done

          legacy='fix/master-durable-r70'
          if exists "$legacy"; then
            echo 'Auditando la rama histórica durable master r70...'
            grep -Fq 'LOCAL_DRAFT_VERSION=71' professional/web/app-master-order.js || { echo '::error::main no contiene el propietario canónico v71 de Lista Maestra'; exit 1; }
            grep -Fq "SERVER_DRAFT_KEY='master-order-v15'" professional/web/app-master-order.js || { echo '::error::main no conserva la clave durable de borrador'; exit 1; }
            grep -Fq 'SERVER_AUTOSAVE_DELAY=1200' professional/web/app-master-order.js || { echo '::error::main no conserva autosave durable'; exit 1; }
            grep -Fq "return import('./app-master-order.js')" professional/web/app-order-core.js || { echo '::error::app-order-core no delega al propietario canónico actual'; exit 1; }
            legacy_sha=$(git rev-parse "origin/$legacy")
            archive_tag='archive/master-durable-r70-20260819'
            if ! git ls-remote --exit-code --tags origin "refs/tags/$archive_tag" >/dev/null 2>&1; then
              git tag "$archive_tag" "$legacy_sha"
              git push origin "refs/tags/$archive_tag"
              echo "Archivado $legacy en $archive_tag -> $legacy_sha"
            else
              echo "Tag de archivo ya existe: $archive_tag"
            fi
          fi

          delete_branches=(
            'agent/ai-reconciliation-extras-v88'
            'agent/auth-passkeys-finalization'
            'agent/canonical-reconcile-finance-motion'
            'agent/canonical-release-verification'
            'agent/catalog-finance-icon-v81'
            'agent/dashboard-reconcile-dark-v82'
            'agent/deploy-hardening-v86'
            'agent/e2e-release-contract'
            'agent/final-unit-supplier-readers'
            'agent/invoice-arithmetic-context'
            'agent/mobile-auth-invoice-v83'
            'agent/native-fast-consolidation'
            'agent/navigation-sessions-master-v87'
            'agent/payment-documents-r74'
            'agent/payment-proof-ops-consolidation'
            'agent/professional-readiness-v84'
            'agent/r78-invoice-matrix-passkeys-payment-ledger'
            'agent/reception-close-ios26'
            'agent/reconciliation-engine-r75'
            'agent/self-service-readiness-v85'
            'agent/v81-release-cutover'
            'fix/master-durable-r70'
            'fix/v91-production-stability'
            'noop-do-not-create'
            'tmp'
            'tmp2'
            'tmp3'
          )

          echo 'Eliminando únicamente ramas auditadas y expresamente permitidas...'
          for branch in "${delete_branches[@]}"; do
            case "$branch" in main|develop) echo '::error::Guard de ramas canónicas activado'; exit 1;; esac
            if ! exists "$branch"; then
              echo "ya ausente: $branch"
              continue
            fi
            encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$branch")
            gh api --method DELETE "repos/$repo/git/refs/heads/$encoded"
            echo "eliminada: $branch"
          done

          echo 'Verificando inventario final...'
          mapfile -t remaining < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | sort)
          printf 'Ramas restantes:\n'; printf ' - %s\n' "${remaining[@]}"
          if [ "${#remaining[@]}" -ne 2 ] || [ "${remaining[0]}" != 'develop' ] || [ "${remaining[1]}" != 'main' ]; then
            echo '::error::El inventario final no contiene exclusivamente develop y main.'
            exit 1
          fi
          echo 'Branch cleanup OK: solo main y develop permanecen.'
