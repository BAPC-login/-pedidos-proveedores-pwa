name: Deploy Nuvasto development
on:
  push:
    branches: [develop]
    paths: ['professional/**','worker/**','wrangler.jsonc','.github/workflows/deploy-development.yml']
  workflow_dispatch:
permissions: {contents: read, statuses: write}
concurrency: {group: deploy-nuvasto-development, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}

      - name: Validate development candidate
        id: candidate
        working-directory: professional
        run: npm run verify

      - name: Confirm Cloudflare deployment credential
        shell: bash
        env: {CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; fi

      - name: Deploy isolated Worker, D1 and R2
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: f1adc1e73490ce30fe3c1588d2ca57fb
          workingDirectory: professional
          wranglerVersion: '4.114.0'
          command: deploy --config wrangler.develop.toml --keep-vars

      - name: Ensure private DEV IP hash salt
        id: ip_hash_salt
        if: steps.deploy.outcome == 'success'
        working-directory: professional
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: f1adc1e73490ce30fe3c1588d2ca57fb
        run: |
          set -euo pipefail
          secrets_file=$(mktemp)
          npx --yes wrangler@4.114.0 secret list --config wrangler.develop.toml --format json > "$secrets_file"
          if SECRETS_FILE="$secrets_file" node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync(process.env.SECRETS_FILE,'utf8'));process.exit(rows.some(row=>row.name==='IP_HASH_SALT')?0:1)"; then
            echo 'IP_HASH_SALT DEV ya está configurado como secret.'
          else
            openssl rand -hex 32 | npx --yes wrangler@4.114.0 secret put IP_HASH_SALT --config wrangler.develop.toml
            echo 'IP_HASH_SALT DEV privado creado; no se expuso su valor.'
          fi

      - name: Configure Gemini DEV secret
        id: secrets
        if: steps.deploy.outcome == 'success'
        working-directory: professional
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          DEV_GEMINI_API_KEY: '${{ secrets.NUVASTO_DEV_GEMINI_API_KEY }}'
        run: |
          set -euo pipefail
          if [ -n "$DEV_GEMINI_API_KEY" ]; then
            printf '%s' "$DEV_GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.develop.toml
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::NUVASTO_DEV_GEMINI_API_KEY no está configurado; el canary IA se omitirá.'
          fi

      - name: Verify live current generation
        id: verify
        working-directory: professional
        env:
          NUVASTO_BASE_URL: 'https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev'
          NUVASTO_EXPECT_ENV: development
        run: node scripts/verify-live-current.mjs

      - name: Bootstrap and seed DEV QA data
        id: seed
        if: steps.verify.outcome == 'success'
        working-directory: professional
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          NUVASTO_E2E_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
          NUVASTO_E2E_EMAIL: 'e2e@nuvasto.dev'
          NUVASTO_BASE_URL: 'https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev'
        run: |
          set -euo pipefail
          if [ -z "$NUVASTO_E2E_PASSWORD" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::NUVASTO_DEV_E2E_PASSWORD no está configurado; los E2E autenticados se omitirán.'
            exit 0
          fi
          bootstrap_token=$(openssl rand -hex 32)
          echo "::add-mask::$bootstrap_token"
          printf '%s' "$bootstrap_token" | npx wrangler secret put BOOTSTRAP_ADMIN_TOKEN --config wrangler.develop.toml
          for attempt in $(seq 1 12); do
            if NUVASTO_BOOTSTRAP_TOKEN="$bootstrap_token" node tests/development-seed.mjs; then
              echo 'configured=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" = "12" ]; then echo '::error::BOOTSTRAP_ADMIN_TOKEN no se propagó a tiempo'; exit 1; fi
            sleep 5
          done

      - name: Full destructive E2E on isolated DEV only
        id: e2e
        if: steps.seed.outputs.configured == 'true'
        working-directory: professional
        env:
          NUVASTO_BASE_URL: 'https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev'
          NUVASTO_E2E_EMAIL: 'e2e@nuvasto.dev'
          NUVASTO_E2E_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
        run: node tests/development-e2e-v92.mjs

      - name: Company and supplier branding E2E on DEV
        id: branding_e2e
        if: steps.seed.outputs.configured == 'true'
        working-directory: professional
        env:
          NUVASTO_BASE_URL: 'https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev'
          NUVASTO_E2E_EMAIL: 'e2e@nuvasto.dev'
          NUVASTO_E2E_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
        run: node tests/development-branding-e2e-v93.mjs

      - name: Supplier profile and payment terms E2E on DEV
        id: supplier_e2e
        if: steps.seed.outputs.configured == 'true'
        working-directory: professional
        env:
          NUVASTO_BASE_URL: 'https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev'
          NUVASTO_E2E_EMAIL: 'e2e@nuvasto.dev'
          NUVASTO_E2E_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
        run: node tests/development-supplier-profile-e2e-v94.mjs

      - name: Real invoice AI canary on DEV
        id: ai_canary
        if: steps.seed.outputs.configured == 'true' && steps.secrets.outputs.configured == 'true'
        working-directory: professional
        env:
          NUVASTO_BASE_URL: 'https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev'
          NUVASTO_E2E_EMAIL: 'e2e@nuvasto.dev'
          NUVASTO_E2E_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
        run: node tests/development-ai-canary-v92.mjs

      - name: Publish development status on commit
        if: always() && !cancelled()
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if [ "${{ steps.candidate.outcome }}" = "success" ] && [ "${{ steps.deploy.outcome }}" = "success" ] && [ "${{ steps.ip_hash_salt.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ] && [ "${{ steps.seed.outcome }}" != "failure" ] && [ "${{ steps.e2e.outcome }}" != "failure" ] && [ "${{ steps.branding_e2e.outcome }}" != "failure" ] && [ "${{ steps.supplier_e2e.outcome }}" != "failure" ] && [ "${{ steps.ai_canary.outcome }}" != "failure" ]; then
            state=success
            if [ "${{ steps.seed.outputs.configured }}" = "true" ] && [ "${{ steps.secrets.outputs.configured }}" = "true" ]; then description='Nuvasto DEV · current UI + operación + proveedores + logos + IA OK'; else description='Nuvasto DEV current verificado; cobertura opcional incompleta'; fi
          else
            state=failure
            description='Nuvasto DEV no quedó listo'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='nuvasto/development' -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
