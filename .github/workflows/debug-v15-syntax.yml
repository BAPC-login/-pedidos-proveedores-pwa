name: Debug v15 syntax

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply targeted syntax repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('professional/worker/src/api/enterprise-v15.js')
          s=p.read_text()
          old="statements.push(env.DB.prepare(`INSERT OR REPLACE INTO ${table}(${keys.join(',')}) VALUES(${keys.map(()=>'?').join(',')})`).bind(...values)}}await"
          new="statements.push(env.DB.prepare(`INSERT OR REPLACE INTO ${table}(${keys.join(',')}) VALUES(${keys.map(()=>'?').join(',')})`).bind(...values))}}await"
          if old in s:
              p.write_text(s.replace(old,new))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add professional/worker/src/api/enterprise-v15.js
            git commit -m "fix: repair backup restoration statement"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Capture syntax and tests
        shell: bash
        run: |
          cd professional
          set +e
          npm run verify > ../v15-debug.log 2>&1
          code=$?
          echo "exit_code=$code" >> ../v15-debug.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: v15-debug-bundle
          path: |
            v15-debug.log
            professional/worker/src/api/enterprise-v15.js
          retention-days: 1
