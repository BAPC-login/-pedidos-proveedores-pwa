name: Agent r78 implementation
on:
  push:
    branches:
      - agent/r78-invoice-matrix-passkeys-payment-ledger
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/r78-invoice-matrix-passkeys-payment-ledger
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply r78
        run: python3 professional/scripts/agent-r78.py
      - name: Verify
        working-directory: professional
        run: npm run verify
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add professional/worker professional/web professional/tests professional/package.json worker
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Nuvasto r78: adaptive invoice matrix, passkey enrollment and payment ledger'
          git push origin HEAD:agent/r78-invoice-matrix-passkeys-payment-ledger
