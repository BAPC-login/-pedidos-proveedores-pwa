name: QA copy real catalog to isolated DEV
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type COPIAR_CATALOGO_A_DEV to authorize a one-way QA catalog copy'
        required: true
        type: string
      apply:
        description: 'Import into DEV after verified dry run (production always GET-only)'
        type: choice
        options: ['no', 'yes']
        default: 'no'
permissions: {contents: read}
concurrency: {group: nuvasto-qa-catalog-copy, cancel-in-progress: false}
jobs:
  sync:
    if: github.ref_name == 'fix/invoice-xml-costs-order-closure-20261015' && inputs.confirmation == 'COPIAR_CATALOGO_A_DEV'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify syntax before touching QA
        working-directory: professional
        run: npm run build:current && npm run check
      - name: Validate secure QA credentials
        env:
          SOURCE_READONLY_TOKEN: '${{ secrets.NUVASTO_QA_SOURCE_TOKEN }}'
          DEV_QA_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
        shell: bash
        run: |
          if [ -z "$SOURCE_READONLY_TOKEN" ]; then echo "::error::Configure NUVASTO_QA_SOURCE_TOKEN with an existing read-only production session"; exit 1; fi
          if [ "${#DEV_QA_PASSWORD}" -lt 10 ]; then echo "::error::DEV QA password not configured"; exit 1; fi
      - name: Dry run catalog snapshot (zero writes)
        working-directory: professional
        env:
          NUVASTO_QA_SOURCE_TOKEN: '${{ secrets.NUVASTO_QA_SOURCE_TOKEN }}'
          NUVASTO_DEV_E2E_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
          NUVASTO_QA_COPY_CONFIRM: '${{ inputs.confirmation }}'
          NUVASTO_QA_DRY_RUN: 'true'
        run: node scripts/qa-copy-catalog-v98.mjs
      - name: Import into isolated DEV only
        if: inputs.apply == 'yes'
        working-directory: professional
        env:
          NUVASTO_QA_SOURCE_TOKEN: '${{ secrets.NUVASTO_QA_SOURCE_TOKEN }}'
          NUVASTO_DEV_E2E_PASSWORD: '${{ secrets.NUVASTO_DEV_E2E_PASSWORD }}'
          NUVASTO_QA_COPY_CONFIRM: '${{ inputs.confirmation }}'
          NUVASTO_QA_DRY_RUN: 'false'
        run: node scripts/qa-copy-catalog-v98.mjs
