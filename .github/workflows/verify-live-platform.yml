name: Verify live Nuvasto Platform

# Ejecución manual hasta completar el secret de despliegue de Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Resolve expected production version
        id: expected
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('professional/package.json','utf8')).version")
          release=$(node -e "const s=require('fs').readFileSync('worker/src/combined.js','utf8');const m=s.match(/PLATFORM_RELEASE='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Verify production shell, API, security and R2
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
          EXPECTED_RELEASE: ${{ steps.expected.outputs.release }}
        run: |
          set -euo pipefail
          base='https://pedidos-pro-ai.botreservasmultilocal.workers.dev'
          app=$(curl --fail --silent --show-error --max-time 20 "$base/")
          ai=$(curl --fail --silent --show-error --max-time 20 "$base/health")
          platform=$(curl --fail --silent --show-error --max-time 20 --dump-header /tmp/platform.headers "$base/platform/health")
          release=$(grep -Ei '^x-nuvasto-release:|^x-pedidos-pro-release:' /tmp/platform.headers | head -1 | tr -d '\r' | awk '{print $2}')
          echo "$app" | grep -q '<title>Nuvasto</title>'
          echo "$ai" | grep -q '"service":"pedidos-pro-ai"'
          echo "$ai" | grep -q '"geminiConfigured":true'
          PLATFORM_HEALTH="$platform" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_RELEASE="$EXPECTED_RELEASE" RELEASE="$release" node <<'NODE'
          const h=JSON.parse(process.env.PLATFORM_HEALTH||'{}');
          const ok=h.ok===true
            && h.service==='nuvasto'
            && h.productName==='Nuvasto'
            && h.version===process.env.EXPECTED_VERSION
            && process.env.RELEASE===process.env.EXPECTED_RELEASE
            && Number(h.schemaVersion||0)>=21
            && h.databaseConfigured===true
            && h.databaseInitialized===true
            && h.catalogReady===true
            && h.r2Configured===true
            && h.r2Required===true
            && h.r2Ready===true
            && h.storageBackend==='r2'
            && Number(h.invoiceFlowVersion||0)>=28
            && Number(h.keyboardNavigationVersion||0)>=28
            && Number(h.modalFlowVersion||0)>=28;
          if(!ok){console.error(JSON.stringify(h,null,2));process.exit(1)}
          NODE
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/api/me")" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"email":"admin@nuvasto.invalid","password":"incorrecta"}' "$base/api/auth/login")" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"organizationName":"Unauthorized","locationName":"Unauthorized","displayName":"Unauthorized","email":"unauthorized@example.com","password":"unauthorized-password"}' "$base/api/bootstrap")" = '403'
          echo 'Nuvasto productivo verificado con R2 y controles de seguridad.'
