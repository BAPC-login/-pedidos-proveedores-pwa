name = "pedidos-pro-ai-dev"
account_id = "f1adc1e73490ce30fe3c1588d2ca57fb"
main = "../worker/src/combined.js"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/v1/*", "/platform/health", "/platform/release"]

[vars]
GEMINI_MODEL = "gemini-3.5-flash"
ENVIRONMENT = "development"
PRODUCT_NAME = "Nuvasto DEV"
AI_ENDPOINT = "https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev"
ALLOWED_ORIGINS = "https://pedidos-pro-ai-dev.botreservasmultilocal.workers.dev,http://localhost:8787,http://127.0.0.1:8787,http://localhost:8788,http://127.0.0.1:8788"
REQUIRE_R2 = "true"

# Desarrollo usa recursos exclusivos. Wrangler 4.45+ puede aprovisionar D1/R2
# automáticamente cuando el binding no tiene resource ID. Al estar asociados al
# Worker pedidos-pro-ai-dev, futuros deploys reutilizan esos mismos recursos.
[[d1_databases]]
binding = "DB"

[[r2_buckets]]
binding = "FILES"
